[project]
name = "inkfish"
version = "0.1.0"
description = "Autonomous character simulation engine that outputs web fiction"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlalchemy==2.0.*",
    "openai==1.55.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.6.*",
    "tenacity==9.0.*",
    "typer==0.13.*",
    "python-dateutil==2.9.*",
]

[project.scripts]
inkfish = "inkfish.cli:app"

[dependency-groups]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==6.0.*",
    "respx==0.21.*",
    "httpx==0.27.*",
    "black==24.10.*",
    "ruff==0.7.*",
    "isort==5.13.*",
    "mypy==1.13.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkfish"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
strict_optional = true
