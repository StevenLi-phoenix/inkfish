[simulation]
tick_interval_hours = 1
max_steps = 0
max_concurrent_llm_calls = 1   # P0 sync

[characters]
min_weight = 0.05
max_updates_per_tick = 3
interaction_max_limit = 10
dpo_sigma = 0.1

[directors]
count = 1
pacing_stale_threshold = 5

[routing]
default_provider = "deepseek"
# 角色 (M3) 用 v4-flash：非 reasoner，速度快 10×、成本同价但 max_tokens 用得少。
# 未来 director (M5) + writer (M6) 用 v4-pro 走单独 routing rule。
default_model = "deepseek-v4-flash"

[storage]
db_url = "sqlite:///data/inkfish.db"

[hot_topics]
enabled = false
source = "manual"
poll_interval_minutes = 60

[writer]
suggested_split_ticks = 50

[llm]
max_retries = 3
temperature = 0.7
# v4-flash 非 reasoner：直接输出 content，无 reasoning_tokens 消耗。
# 2000 给 content (~500 字) + tool_call 参数序列化 (~500 tokens) + 余量。
max_tokens = 2000
log_level = "INFO"
